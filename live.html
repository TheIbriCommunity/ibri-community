cat << 'EOF' > live.html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAHU'SHAR'AL The Qodeshym - Live Broadcast</title>

    <!-- Brand Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet" />

    <style>
        /* Brand Specifications */
        body {
            background-color: #F5F1E8; 
            margin: 0;
            padding: 0;
            font-family: 'Lora', serif;
            color: #333;
        }

        header, footer {
            background-color: #006400;
            color: #F5F1E8;
            padding: 1.5rem;
            text-align: center;
            font-family: 'Playfair Display', serif;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            letter-spacing: 1px;
        }

        .player-wrapper {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .video-js {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0px 8px 24px rgba(0,0,0,0.15);
            overflow: hidden;
            background-color: #000;
        }
    </style>
</head>
<body>

    <header>
        <h1>The Ibri Community Network</h1>
        <p style="font-family: 'Lora', serif; margin-top: 5px;">Live Broadcast</p>
    </header>

    <main class="player-wrapper">
        <div style="position: relative;">
            <!-- Video Player -->
            <video-js id="ibricommunity-player" class="video-js vjs-big-play-centered" controls preload="auto" data-setup='{"fluid": true}'>
                <source src="https://stream.ibricommunity.org/hls/test.m3u8" type="application/x-mpegURL">
                <p class="vjs-no-js">To view this video please enable JavaScript.</p>
            </video-js>
            
            <!-- VDO.ninja Request to Join Button -->
            <button id="join-request-btn" style="position: absolute; bottom: 20px; right: 20px; z-index: 10; background-color: #006400; color: #F5F1E8; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-family: 'Playfair Display', serif; font-weight: bold;">
                Request to Join
            </button>
        </div>
        
        <!-- Hidden VDO.ninja container -->
        <div id="vdo-container" style="display:none; width:100%; height:400px; margin-top:20px;"></div>
    </main>

    <footer>
        <p>© 2026 The Ibri Community Network</p>
    </footer>

    <script src="https://vjs.zencdn.net/8.6.1/video.min.js"></script>
    
    <script>
        // 1. Initialize Player
        var player = videojs('ibricommunity-player', {
            liveui: true,
            errorDisplay: false 
        });

        player.on('error', function() {
            var error = player.error();
            if (error && error.code === 4) {
                console.log("Stream is currently offline.");
            }
        });

        // 2. VDO.ninja Interaction Logic
        const joinBtn = document.getElementById('join-request-btn');
        const vdoContainer = document.getElementById('vdo-container');
        let vdoIframe = null;

        joinBtn.addEventListener('click', function() {
            joinBtn.style.display = 'none';
            player.pause();
            vdoContainer.style.display = 'block';

            vdoIframe = document.createElement("iframe");
            vdoIframe.allow = "camera;microphone;fullscreen;display-capture;autoplay;";
            vdoIframe.src = "https://vdo.ninja/?room=ibricommunity_live&cleanoutput"; 
            vdoIframe.style.width = "100%";
            vdoIframe.style.height = "100%";
            vdoIframe.style.border = "none";
            
            vdoContainer.appendChild(vdoIframe);
        });
    </script>
</body>
</html>
EOF
